{% if not products %}
<p class="text-muted">{{ empty_message|default('No products yet.') }}</p>
{% endif %}

<div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-4">
  {% for product in products %}
  <div class="col">
    <div class="card h-100 product-card">
      <a
        href="{{ url_for('main.product_detail', slug=product.slug) }}"
        tabindex="-1"
        aria-hidden="true"
      >
        <div class="ratio ratio-1x1">
          <img
            src="{{ product_image_url(product) }}"
            alt="{{ product.name }}"
            class="card-img-top object-fit-cover"
            loading="lazy"
          />
        </div>
      </a>
      <div class="card-body">
        <h3 class="card-title h5">
          <a
            class="text-decoration-none"
            href="{{ url_for('main.product_detail', slug=product.slug) }}"
            >{{ product.name }}</a
          >
        </h3>
        <p class="card-text text-muted small">
          {{ product.get_technical_summary() }}
        </p>
      </div>
      <div
        class="card-footer d-flex justify-content-between align-items-center"
      >
        <strong>{{ product.price_display }}</strong>
        <a
          class="btn btn-sm btn-primary"
          href="{{ url_for('main.product_detail', slug=product.slug) }}"
          aria-label="View {{ product.name }}"
          >View</a
        >
      </div>
    </div>
  </div>
  {% endfor %}
</div>
