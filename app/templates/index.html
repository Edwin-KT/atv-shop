{% extends "base.html" %} {% block content %}
<h1 class="mb-4">Catalog</h1>

{% if not products %}
<p class="text-muted">No products yet.</p>
{% endif %}

<div class="row row-cols-1 row-cols-md-3 g-4">
  {% for product in products %}
  <div class="col">
    <div class="card h-100">
      <a href="{{ url_for('main.product_detail', slug=product.slug) }}">
        <div class="ratio ratio-4x3">
          <img
            src="{{ product_image_url(product) }}"
            alt="{{ product.name }}"
            class="card-img-top object-fit-cover"
            loading="lazy"
          />
        </div>
      </a>
      <div class="card-body">
        <h5 class="card-title">
          <a
            class="text-decoration-none"
            href="{{ url_for('main.product_detail', slug=product.slug) }}"
            >{{ product.name }}</a
          >
        </h5>
        <p class="card-text text-muted small">
          {{ product.get_technical_summary() }}
        </p>
      </div>
      <div
        class="card-footer d-flex justify-content-between align-items-center"
      >
        <strong>{{ product.price_display }}</strong>
        <a
          class="btn btn-sm btn-primary"
          href="{{ url_for('main.product_detail', slug=product.slug) }}"
          >View</a
        >
      </div>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
