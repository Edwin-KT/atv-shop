{% extends "base.html" %} {% block title %}Login - ATV & Enduro Shop{% endblock
%} {% block content %}
<h1>Login</h1>

{% if error %}
<div class="alert alert-danger">{{ error }}</div>
{% endif %}

<form method="post" class="col-md-6 px-0">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
  <div class="mb-3">
    <label class="form-label" for="email">Email</label>
    <input
      class="form-control"
      id="email"
      name="email"
      type="email"
      value="{{ email }}"
      required
    />
  </div>
  <div class="mb-3">
    <label class="form-label" for="password">Password</label>
    <input
      class="form-control"
      id="password"
      name="password"
      type="password"
      required
    />
  </div>
  <button class="btn btn-primary" type="submit">Login</button>
</form>
{% endblock %}
