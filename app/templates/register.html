{% extends "base.html" %} {% block title %}Register - ATV & Enduro Shop{%
endblock %} {% block content %}
<h1>Create account</h1>

{% if errors %}
<div class="alert alert-danger">
  <ul class="mb-0">
    {% for error in errors %}
    <li>{{ error }}</li>
    {% endfor %}
  </ul>
</div>
{% endif %}

<form method="post" class="col-md-6 px-0">
  <div class="mb-3">
    <label class="form-label" for="email">Email</label>
    <input
      class="form-control"
      id="email"
      name="email"
      type="email"
      value="{{ email }}"
      required
    />
  </div>
  <div class="mb-3">
    <label class="form-label" for="phone">Phone (10 digits)</label>
    <input
      class="form-control"
      id="phone"
      name="phone"
      value="{{ phone }}"
      required
    />
  </div>
  <div class="mb-3">
    <label class="form-label" for="password">Password</label>
    <input
      class="form-control"
      id="password"
      name="password"
      type="password"
      required
    />
  </div>
  <button class="btn btn-primary" type="submit">Register</button>
</form>
{% endblock %}
